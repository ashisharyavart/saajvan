<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="projectPageTitle">Project Details — Saajvan Design Studio</title>
  <meta id="projectPageDesc" name="description" content="Explore bespoke interior architecture and space planning by Saajvan Design Studio.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Poppins:wght@600;700;800&family=Sacramento&family=Lora:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <style>
    /* =========================================================
       DEDICATED PROJECT DETAIL PAGE — LUXURY EDITORIAL THEME
       ========================================================= */
    :root {
      --proj-bg: #0E0C0A;
      --proj-panel: #17130F;
      --proj-card: #1C1712;
      --proj-gold: #B9834A;
      --proj-gold-hover: #D49C5E;
      --proj-cream: #F2ECE0;
      --proj-muted: #8E8478;
      --proj-border: rgba(255, 255, 255, 0.09);
    }

    body.project-detail-body {
      margin: 0;
      padding: 0;
      background: var(--proj-bg);
      color: var(--proj-cream);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* TOP HEADER BAR */
    .project-header-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(14, 12, 10, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--proj-border);
      padding: 16px 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .project-header-left {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .project-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--proj-border);
      border-radius: 2px;
      color: var(--proj-cream);
      font-family: var(--font-cormorant);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      text-decoration: none;
      transition: all 0.25s ease;
      cursor: pointer;
    }
    .project-back-btn:hover {
      background: var(--proj-gold);
      border-color: var(--proj-gold);
      color: #FFF;
      transform: translateX(-3px);
    }
    .project-back-btn svg {
      width: 14px;
      height: 14px;
      transition: transform 0.25s ease;
    }
    .project-back-btn:hover svg {
      transform: translateX(-3px);
    }

    .project-header-logo {
      display: flex;
      align-items: center;
      text-decoration: none;
    }
    .project-header-logo img {
      height: 38px;
      width: auto;
      object-fit: contain;
    }

    .project-header-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .project-counter-pill {
      font-family: var(--font-cormorant);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.16em;
      color: var(--proj-muted);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--proj-border);
      padding: 6px 16px;
      border-radius: 20px;
    }
    .project-counter-pill .active-num {
      color: var(--proj-gold);
    }
    .project-counter-pill .total-num {
      color: var(--proj-cream);
    }

    /* MAIN EDITORIAL CONTAINER */
    .project-main-container {
      flex: 1;
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 36px 40px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* PROJECT INFO SUMMARY */
    .project-info-header {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
    }
    .project-meta-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .project-category-badge {
      font-family: var(--font-cormorant);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      color: var(--proj-gold);
    }
    .project-title-h1 {
      font-family: var(--font-playfair);
      font-size: clamp(28px, 3.5vw, 44px);
      font-weight: 600;
      color: #FFFFFF;
      margin: 2px 0 6px;
      letter-spacing: 0.02em;
      line-height: 1.15;
    }
    .project-desc-p {
      font-size: 15px;
      line-height: 1.6;
      color: var(--proj-muted);
      max-width: 820px;
      margin: 0;
    }

    /* VIEWER STAGE */
    .project-viewer-stage {
      position: relative;
      width: 100%;
      height: 64vh;
      min-height: 420px;
      max-height: 760px;
      background: var(--proj-panel);
      border: 1px solid var(--proj-border);
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
      user-select: none;
    }

    .project-media-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 16px;
      box-sizing: border-box;
    }

    .project-display-media {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 2px;
      display: none;
    }
    .project-display-media.active-display {
      display: block;
    }

    /* NAVIGATION BUTTONS */
    .project-nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: rgba(14, 12, 10, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 20;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: all 0.2s ease;
    }
    .project-nav-arrow:hover {
      background: var(--proj-gold);
      border-color: var(--proj-gold);
      color: #FFF;
      transform: translateY(-50%) scale(1.08);
      box-shadow: 0 8px 24px rgba(185, 131, 74, 0.35);
    }
    .project-nav-arrow.prev-arrow { left: 24px; }
    .project-nav-arrow.next-arrow { right: 24px; }
    .project-nav-arrow svg {
      width: 22px;
      height: 22px;
    }

    /* THUMBNAIL STRIP */
    .project-thumbs-container {
      width: 100%;
      background: var(--proj-panel);
      border: 1px solid var(--proj-border);
      border-radius: 2px;
      padding: 16px 20px;
      box-sizing: border-box;
    }
    .project-thumbs-track {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 4px 2px;
      scrollbar-width: thin;
      scrollbar-color: var(--proj-gold) rgba(255, 255, 255, 0.06);
    }
    .project-thumbs-track::-webkit-scrollbar {
      height: 5px;
    }
    .project-thumbs-track::-webkit-scrollbar-thumb {
      background: var(--proj-gold);
      border-radius: 3px;
    }

    .project-thumb-item {
      flex: 0 0 105px;
      height: 72px;
      position: relative;
      border-radius: 2px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      opacity: 0.45;
      background: var(--proj-card);
      transition: opacity 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
    }
    .project-thumb-item:hover {
      opacity: 0.85;
      transform: translateY(-2px);
    }
    .project-thumb-item.active {
      opacity: 1;
      border-color: var(--proj-gold);
      transform: scale(1.04);
      box-shadow: 0 4px 16px rgba(185, 131, 74, 0.35);
    }
    .project-thumb-item img,
    .project-thumb-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }
    .project-thumb-play-badge {
      position: absolute;
      top: 5px;
      right: 5px;
      background: rgba(0, 0, 0, 0.75);
      border-radius: 50%;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--proj-gold);
    }
    .project-thumb-play-badge svg {
      width: 10px;
      height: 10px;
      fill: currentColor;
    }

    /* FOOTER CTA STRIP */
    .project-footer-cta {
      margin-top: 20px;
      padding: 40px 32px;
      background: var(--proj-panel);
      border: 1px solid var(--proj-border);
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
    }
    .project-footer-cta-text h3 {
      font-family: var(--font-playfair);
      font-size: 24px;
      margin: 0 0 6px;
      color: #FFF;
    }
    .project-footer-cta-text p {
      margin: 0;
      color: var(--proj-muted);
      font-size: 14.5px;
    }
    .project-cta-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* RESPONSIVE STYLES */
    @media (max-width: 900px) {
      .project-header-bar {
        padding: 14px 20px;
      }
      .project-main-container {
        padding: 16px 20px 32px;
      }
      .project-viewer-stage {
        height: 52vh;
        min-height: 340px;
      }
      .project-nav-arrow {
        width: 44px;
        height: 44px;
      }
      .project-nav-arrow.prev-arrow { left: 12px; }
      .project-nav-arrow.next-arrow { right: 12px; }
      .project-thumb-item {
        flex: 0 0 85px;
        height: 58px;
      }
    }

    @media (max-width: 600px) {
      .project-header-bar {
        padding: 12px 16px;
        flex-wrap: wrap;
      }
      .project-header-left {
        gap: 14px;
      }
      .project-back-btn span {
        display: none;
      }
      .project-main-container {
        padding: 12px 14px 24px;
        gap: 18px;
      }
      .project-viewer-stage {
        height: 46vh;
        min-height: 280px;
      }
      .project-nav-arrow {
        width: 38px;
        height: 38px;
      }
      .project-nav-arrow.prev-arrow { left: 8px; }
      .project-nav-arrow.next-arrow { right: 8px; }
      .project-thumbs-container {
        padding: 12px 12px;
      }
      .project-thumb-item {
        flex: 0 0 74px;
        height: 50px;
      }
      .project-footer-cta {
        padding: 24px 20px;
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>

  <!-- Site Config & Projects Data -->
  <script src="data/site-config.js"></script>
  <script src="data/projects-data.js"></script>
</head>

  <!-- ============ INSTANT ZERO-LAG PROJECT DETAIL CONTROLLER ============ -->
  <script>
    (function initProjectDetailPage() {
      // 1. Resolve Target Project from URL
      function getActiveProjectSlug() {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('id')) return urlParams.get('id');
        if (urlParams.get('project')) return urlParams.get('project');
        if (urlParams.get('p')) return urlParams.get('p');

        // Pathname parsing (e.g., /projects/cleo-county-noida)
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        if (pathSegments.length > 0) {
          const last = pathSegments[pathSegments.length - 1].replace(/\.html$/i, '');
          if (last !== 'project' && last !== 'projects') {
            return last;
          }
        }
        if (window.location.hash) {
          return window.location.hash.replace(/^#/, '');
        }
        return null;
      }

      const allProjects = window.getSaajvanProjects ? window.getSaajvanProjects() : (window.SAAJVAN_PROJECTS_DATA || []);
      if (!allProjects.length) {
        console.error('Projects data not found.');
        return;
      }

      const slug = getActiveProjectSlug();
      let project = slug && window.getSaajvanProjectBySlug ? window.getSaajvanProjectBySlug(slug) : null;

      // Fallback to first project if slug not found
      if (!project) {
        project = allProjects[0];
      }

      // Update Page Metadata
      document.title = `${project.name} — Saajvan Design Studio Portfolio`;
      const descMeta = document.getElementById('projectPageDesc');
      if (descMeta) descMeta.setAttribute('content', `${project.name} (${project.category}) by Saajvan Design Studio. ${project.shortDesc}`);

      // DOM Elements
      const projectCategory = document.getElementById('projectCategory');
      const projectTitle = document.getElementById('projectTitle');
      const projectDescription = document.getElementById('projectDescription');
      const currentMediaIndexEl = document.getElementById('currentMediaIndex');
      const totalMediaCountEl = document.getElementById('totalMediaCount');

      const mainDisplayImg = document.getElementById('mainDisplayImg');
      const mainDisplayVideo = document.getElementById('mainDisplayVideo');
      const navPrevBtn = document.getElementById('navPrevBtn');
      const navNextBtn = document.getElementById('navNextBtn');
      const projectThumbsTrack = document.getElementById('projectThumbsTrack');
      const projectViewerStage = document.getElementById('projectViewerStage');

      // Populate Header Info
      if (projectCategory) projectCategory.textContent = project.category;
      if (projectTitle) projectTitle.textContent = project.name;
      if (projectDescription) projectDescription.textContent = project.shortDesc;

      const mediaList = project.media || [];
      const totalCount = mediaList.length;
      if (totalMediaCountEl) totalMediaCountEl.textContent = String(totalCount).padStart(2, '0');

      if (!totalCount) return;

      let currentIndex = 0;
      const thumbElements = [];
      const imagePreloadCache = new Map();

      // Background Image Preloader Cache for Zero-Lag Instant Switching
      function preloadImage(url) {
        if (!url || imagePreloadCache.has(url)) return;
        const img = new Image();
        img.src = url;
        imagePreloadCache.set(url, img);
      }

      // Preload all project images asynchronously so arrow navigation is 100% instant
      function preloadAllProjectImages() {
        mediaList.forEach(item => {
          if (item.type === 'image') {
            preloadImage(item.url);
          }
        });
      }

      // Build Horizontal Thumbnails
      function renderThumbnailStrip() {
        projectThumbsTrack.innerHTML = '';
        mediaList.forEach((item, idx) => {
          const thumb = document.createElement('div');
          thumb.className = `project-thumb-item ${idx === 0 ? 'active' : ''}`;
          thumb.setAttribute('data-index', idx);
          thumb.setAttribute('title', `Media ${idx + 1} of ${totalCount}`);

          if (item.type === 'video') {
            thumb.innerHTML = `
              <video src="${item.url}#t=0.5" preload="metadata" muted playsinline></video>
              <div class="project-thumb-play-badge">
                <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
              </div>
            `;
          } else {
            thumb.innerHTML = `<img src="${item.url}" alt="${project.name} thumbnail ${idx + 1}" loading="lazy">`;
          }

          thumb.addEventListener('click', () => {
            showMedia(idx);
          });

          thumbElements.push(thumb);
          projectThumbsTrack.appendChild(thumb);
        });
      }

      // Instant Zero-Lag Display Update
      function showMedia(newIndex) {
        if (newIndex < 0) newIndex = totalCount - 1;
        if (newIndex >= totalCount) newIndex = 0;

        const prevIndex = currentIndex;
        currentIndex = newIndex;
        const item = mediaList[currentIndex];

        // 1. Instant Counter Update
        if (currentMediaIndexEl) {
          currentMediaIndexEl.textContent = String(currentIndex + 1).padStart(2, '0');
        }

        // 2. Direct DOM Element Update (Zero teardown, zero remount)
        if (item.type === 'video') {
          mainDisplayImg.style.display = 'none';
          mainDisplayVideo.style.display = 'block';

          if (mainDisplayVideo.src !== item.url) {
            mainDisplayVideo.pause();
            mainDisplayVideo.src = item.url;
            mainDisplayVideo.currentTime = 0;
            mainDisplayVideo.play().catch(() => {});
          }
        } else {
          // Pause and hide video if switching to image
          if (mainDisplayVideo.style.display !== 'none') {
            mainDisplayVideo.pause();
            mainDisplayVideo.style.display = 'none';
          }

          mainDisplayImg.style.display = 'block';
          mainDisplayImg.src = item.url;
          mainDisplayImg.alt = `${project.name} photo ${currentIndex + 1}`;
        }

        // 3. Fast Thumbnail Active State & Smooth Auto-Scroll
        if (thumbElements[prevIndex]) {
          thumbElements[prevIndex].classList.remove('active');
        }
        if (thumbElements[currentIndex]) {
          thumbElements[currentIndex].classList.add('active');
          thumbElements[currentIndex].scrollIntoView({
            behavior: 'smooth',
            block: 'nearest',
            inline: 'center'
          });
        }

        // 4. Preload adjacent images immediately
        const nextIdx = (currentIndex + 1) % totalCount;
        const prevIdx = (currentIndex - 1 + totalCount) % totalCount;
        if (mediaList[nextIdx] && mediaList[nextIdx].type === 'image') preloadImage(mediaList[nextIdx].url);
        if (mediaList[prevIdx] && mediaList[prevIdx].type === 'image') preloadImage(mediaList[prevIdx].url);
      }

      // Setup Controls & Listeners
      if (navPrevBtn) {
        navPrevBtn.addEventListener('click', (e) => {
          e.preventDefault();
          showMedia(currentIndex - 1);
        });
      }

      if (navNextBtn) {
        navNextBtn.addEventListener('click', (e) => {
          e.preventDefault();
          showMedia(currentIndex + 1);
        });
      }

      // Keyboard Navigation
      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') {
          showMedia(currentIndex - 1);
        } else if (e.key === 'ArrowRight') {
          showMedia(currentIndex + 1);
        } else if (e.key === 'Escape') {
          window.location.href = 'index.html#portfolio';
        }
      });

      // Mobile Touch Gestures
      let touchStartX = 0;
      let touchEndX = 0;
      if (projectViewerStage) {
        projectViewerStage.addEventListener('touchstart', (e) => {
          if (e.changedTouches && e.changedTouches.length > 0) {
            touchStartX = e.changedTouches[0].screenX;
          }
        }, { passive: true });

        projectViewerStage.addEventListener('touchend', (e) => {
          if (e.changedTouches && e.changedTouches.length > 0) {
            touchEndX = e.changedTouches[0].screenX;
            const diff = touchEndX - touchStartX;
            if (diff < -40) {
              showMedia(currentIndex + 1); // Swiped Left -> Next
            } else if (diff > 40) {
              showMedia(currentIndex - 1); // Swiped Right -> Prev
            }
          }
        }, { passive: true });
      }

      // Initialize
      renderThumbnailStrip();
      showMedia(0);

      // Trigger asynchronous background preloading for all remaining images
      setTimeout(preloadAllProjectImages, 150);
    })();
  </script>
</body>

</html>
